name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # g++ and python3 are preinstalled on ubuntu-latest; shm needs no setup.
      - name: C++ suites
        run: make test

      # The python self-checks launch their own daemon — only build the binaries.
      - name: Build daemon and shm library
        run: make daemon libshm_ring

      - name: Python client self-check
        run: python3 python/test_chappe.py

      - name: Python frame self-check
        run: python3 python/test_frames.py

      # The bridge check skips itself without these, and a step that always
      # skips covers nothing — so install them rather than let it no-op.
      - name: Install Redis for the bridge check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          python3 -m pip install --quiet redis

      - name: Redis bridge self-check
        run: python3 python/test_bridge.py

      # Same reasoning as Redis: the check skips itself without these, and a
      # step that always skips covers nothing. libav carries avdec_h264 and
      # ugly carries x264enc.
      - name: Install GStreamer for the frame bridge check
        run: |
          sudo apt-get install -y -qq python3-gi gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: GStreamer frame bridge self-check
        run: python3 python/test_gst_bridge.py

  # Packaging is checked on every push, not just on a tag — a release should
  # never be the first time these are built.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build

      # Installs the sdist with no wheel allowed, so the C ring is compiled the
      # way a source install would compile it, then uses the ring from the
      # installed package alone — cwd is / so nothing resolves to the repo.
      - name: Install from sdist and exercise the packaged ring
        run: |
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install --quiet --no-binary :all: dist/*.tar.gz
          cd / && /tmp/v/bin/python -c "
          import chappe
          from chappe import shm_ring
          assert '/tmp/v/' in shm_ring._lib_path(), shm_ring._lib_path()
          r = shm_ring.Ring.create('/chappe_ci', 32, 2)
          assert r.write(b'packaged')
          i, v = r.retain_latest()
          assert bytes(v[:8]) == b'packaged'
          r.release(i); r.destroy()
          print('packaged ring OK, chappe', chappe.__version__)
          "

      # Both integration paths, against an installed prefix rather than the
      # source tree — that is the only way a broken .pc or Config.cmake shows up.
      - name: C++ consumer builds against the installed prefix
        run: |
          make install PREFIX=/tmp/p
          export PKG_CONFIG_PATH=/tmp/p/lib/pkgconfig
          pkg-config --exists --print-errors chappe
          g++ -std=c++17 -Wall -Wextra examples/keyvalue.cpp \
              $(pkg-config --cflags --libs chappe) -o /tmp/app_pc
          mkdir -p /tmp/c && cp examples/keyvalue.cpp /tmp/c/app.cpp
          cat > /tmp/c/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(chappe_consumer CXX)
          find_package(chappe 2.0 REQUIRED)
          add_executable(app app.cpp)
          target_link_libraries(app PRIVATE chappe::chappe)
          EOF
          cmake -S /tmp/c -B /tmp/c/build -DCMAKE_PREFIX_PATH=/tmp/p
          cmake --build /tmp/c/build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
