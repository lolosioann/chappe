name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # g++ and python3 are preinstalled on ubuntu-latest; shm needs no setup.
      - name: C++ suites
        run: make test

      # The python self-checks launch their own daemon — only build the binaries.
      - name: Build daemon and shm library
        run: make daemon libshm_ring

      - name: Python client self-check
        run: python3 python/test_broker.py

      - name: Python frame self-check
        run: python3 python/test_frames.py

      # The bridge check skips itself without these, and a step that always
      # skips covers nothing — so install them rather than let it no-op.
      - name: Install Redis for the bridge check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          python3 -m pip install --quiet redis

      - name: Redis bridge self-check
        run: python3 python/test_bridge.py
